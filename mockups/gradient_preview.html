<!DOCTYPE html>
<html>
<head>
<title>Dark Gradient Preview</title>
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #111; font-family: system-ui; gap: 40px; }
  .phone { width: 375px; height: 780px; border-radius: 40px; box-shadow: 0 0 0 3px #333, 0 20px 60px rgba(0,0,0,.5); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .current { background: linear-gradient(180deg, #142978, #0C1124); }
  .lifted { background: linear-gradient(180deg, #1C3388, #141A32); }
  .lifted2 { background: linear-gradient(180deg, #243D98, #1C2240); }
  .lifted3 { background: linear-gradient(180deg, #2C47A8, #242A4E); }
  .lifted4 { background: linear-gradient(180deg, #3451B8, #2C325C); }
  .label { color: #fff; font-size: 14px; opacity: .6; margin-bottom: 20px; }
  .top { color: #8899A6; font-size: 13px; }
  .hex { color: #fff; font-size: 28px; font-weight: 700; margin: 4px 0 30px; }
  .arrow { color: #FF328C; font-size: 24px; margin-bottom: 30px; }
  .bot { color: #8899A6; font-size: 13px; }
  .hex2 { color: #fff; font-size: 28px; font-weight: 700; margin: 4px 0; }
</style>
</head>
<body>
  <div class="phone current">
    <div class="label">CURRENT</div>
    <div class="top">top</div>
    <div class="hex">#142978</div>
    <div class="arrow">↓</div>
    <div class="bot">bottom</div>
    <div class="hex2">#0C1124</div>
  </div>
  <div class="phone lifted">
    <div class="label">+2 NOTCHES</div>
    <div class="top">top</div>
    <div class="hex">#1C3388</div>
    <div class="arrow">↓</div>
    <div class="bot">bottom</div>
    <div class="hex2">#141A32</div>
  </div>
  <div class="phone lifted2">
    <div class="label">+4 NOTCHES</div>
    <div class="top">top</div>
    <div class="hex">#243D98</div>
    <div class="arrow">↓</div>
    <div class="bot">bottom</div>
    <div class="hex2">#1C2240</div>
  </div>
  <div class="phone lifted3">
    <div class="label">+6 NOTCHES</div>
    <div class="top">top</div>
    <div class="hex">#2C47A8</div>
    <div class="arrow">↓</div>
    <div class="bot">bottom</div>
    <div class="hex2">#242A4E</div>
  </div>
  <div class="phone lifted4">
    <div class="label">+8 NOTCHES</div>
    <div class="top">top</div>
    <div class="hex">#3451B8</div>
    <div class="arrow">↓</div>
    <div class="bot">bottom</div>
    <div class="hex2">#2C325C</div>
  </div>
</body>
</html>
