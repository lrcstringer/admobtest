name: imalichat
description: "iMaliChat - Earn rewards for your attention"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4

  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Navigation
  go_router: ^14.6.2

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  cloud_functions: ^5.1.6
  firebase_messaging: ^15.1.6
  firebase_analytics: ^11.3.6
  firebase_app_check: ^0.3.1+6

  # Local Database (encrypted with SQLCipher)
  drift: ^2.22.1
  sqlcipher_flutter_libs: ^0.6.4
  sqlite3: ^2.4.0
  path_provider: ^2.1.5
  path: ^1.9.0

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.1

  # Utilities
  dartz: ^0.10.1
  equatable: ^2.0.7
  intl: any
  uuid: ^4.5.1
  collection: ^1.18.0
  internet_connection_checker_plus: ^2.5.2
  shared_preferences: ^2.3.4
  firebase_storage: ^12.3.7

  # UI
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.2.0
  video_player: ^2.9.2
  photo_view: ^0.15.0

  # Audio (voice messages)
  record: ^5.1.2
  just_audio: ^0.9.40

  # Forms & Validation
  reactive_forms: ^17.0.1

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Contacts
  flutter_contacts: ^1.1.9+2

  # Share
  share_plus: ^10.1.3
  url_launcher: ^6.3.1

  # Deep Links
  app_links: ^6.3.3

  # Fonts
  google_fonts: ^6.2.1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Emoji Picker
  emoji_picker_flutter: ^4.3.0

  # Misc
  pin_code_fields: ^8.0.1
  sms_autofill: ^2.2.0
  flutter_animate: ^4.5.0
  confetti: ^0.7.0

  # Image Picker
  image_picker: ^1.1.2

  # Image processing (client-side resize before upload)
  image: ^4.3.0

  # File Picker (web-compatible, used for admin video uploads)
  file_picker: ^8.0.0

  # Camera (for upload video recording)
  camera: ^0.11.0+2

  # Video compression (min variant = smallest binary size)
  # Original ffmpeg_kit_flutter_min archived; using maintained fork
  ffmpeg_kit_flutter_new_min: ^3.1.0

  # Device Info (for fraud prevention)
  device_info_plus: ^10.1.2

  # HTTP client (for external API calls)
  http: ^1.2.2

  # Biometric / Local Authentication
  local_auth: ^2.3.0

  # Cryptography (HMAC-SHA256 for in-app PIN hashing)
  crypto: ^3.0.6

  # E2EE: AES-GCM, X25519, HKDF, PBKDF2
  cryptography: ^2.7.0

  # Phone number parsing & E.164 normalization
  phone_numbers_parser: ^8.3.0

  # Runtime Application Self-Protection
  freerasp: ^6.5.0

  # Google AdMob for rewarded video ads
  google_mobile_ads: ^7.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  open_filex: ^4.7.0
  gal: ^2.3.2
  flutter_webrtc: ^1.3.1
  flutter_callkit_incoming: ^3.0.0
  wakelock_plus: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2
  drift_dev: ^2.22.1

  # Testing
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

  # Launcher Icons
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/botton_nav_bar_icons/
    - assets/video/

  # Plus Jakarta Sans is loaded via google_fonts package.
  # To bundle for offline use, download from Google Fonts and uncomment:
  # fonts:
  #   - family: Plus Jakarta Sans
  #     fonts:
  #       - asset: assets/fonts/PlusJakartaSans-Light.ttf
  #         weight: 300
  #       - asset: assets/fonts/PlusJakartaSans-Regular.ttf
  #       - asset: assets/fonts/PlusJakartaSans-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/PlusJakartaSans-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
  #         weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/iMaliCrown4.png"
  adaptive_icon_foreground: "assets/icons/iMaliCrown4.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_padding: 0
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

dependency_overrides:
  record_linux: ^1.3.0
