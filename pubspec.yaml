name: imalichat
description: "iMaliChat - Earn rewards for your attention"
publish_to: 'none'
version: 2.0.3+19

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0

  # Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^2.5.0

  # Navigation
  go_router: ^17.1.0

  # Firebase
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  cloud_functions: ^6.0.7
  firebase_messaging: ^16.1.2
  firebase_analytics: ^12.1.3
  firebase_app_check: ^0.4.1+5
  firebase_database: ^12.1.4

  # Local Database (encrypted with SQLCipher)
  drift: ^2.22.1
  sqlcipher_flutter_libs: ^0.7.0+eol
  sqlite3: ^3.2.0
  path_provider: ^2.1.5
  path: ^1.9.0
  archive: ^4.0.2

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^7.0.0

  battery_plus: ^6.2.0

  # Utilities
  dartz: ^0.10.1
  equatable: ^2.0.7
  intl: any
  uuid: ^4.5.1
  collection: ^1.18.0
  internet_connection_checker_plus: ^2.5.2
  shared_preferences: ^2.3.4
  firebase_storage: ^13.1.0

  # UI
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.2.0
  video_player: ^2.9.2
  photo_view: ^0.15.0

  # Audio (voice messages)
  record: ^6.2.0
  just_audio: ^0.10.5

  # Forms & Validation
  reactive_forms: ^18.2.2

  # Secure Storage
  flutter_secure_storage: ^10.0.0

  # Contacts
  flutter_contacts: ^2.0.0

  # Share
  share_plus: ^12.0.1
  url_launcher: ^6.3.1

  # Deep Links
  app_links: ^7.0.0

  # Fonts
  google_fonts: ^8.0.2

  # Notifications
  flutter_local_notifications: ^21.0.0

  # Emoji Picker
  emoji_picker_flutter: ^4.3.0

  # Misc
  pin_code_fields: ^9.1.0
  sms_autofill: ^2.2.0
  flutter_animate: ^4.5.0
  confetti: ^0.8.0

  # Image Picker
  image_picker: ^1.1.2

  # Image processing (client-side resize before upload)
  image: ^4.3.0

  # File Picker (web-compatible, used for admin video uploads)
  file_picker: ^10.3.10

  # Camera (for upload video recording)
  camera: ^0.12.0

  # Video compression (min variant = smallest binary size)
  # Original ffmpeg_kit_flutter_min archived; using maintained fork
  ffmpeg_kit_flutter_new_min: ^3.1.0

  # Device Info (for fraud prevention)
  device_info_plus: ^12.3.0

  # HTTP client (for external API calls)
  http: ^1.2.2

  # Biometric / Local Authentication
  local_auth: ^3.0.1

  # Cryptography (HMAC-SHA256 for in-app PIN hashing)
  crypto: ^3.0.6

  # E2EE: AES-GCM, X25519, HKDF, PBKDF2
  cryptography: ^2.7.0

  # Phone number parsing & E.164 normalization
  phone_numbers_parser: ^9.0.20

  # App version info (for minimum version enforcement)
  package_info_plus: ^9.0.0

  # Runtime Application Self-Protection
  freerasp: ^7.5.0

  # Google AdMob for rewarded video ads
  google_mobile_ads: ^7.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  open_filex: ^4.7.0
  gal: ^2.3.2
  flutter_webrtc: ^1.3.1
  flutter_callkit_incoming: ^3.0.0
  wakelock_plus: ^1.4.0
  app_settings: ^7.0.0
  flutter_colorpicker: ^1.1.0
  flutter_quill: ^11.5.0
  flutter_markdown: ^0.7.6
  easy_localization: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2
  drift_dev: ^2.22.1

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  firebase_core_platform_interface: ^6.0.2

  # Launcher Icons
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/buy/
    - assets/icons/buy/personal-care-beauty/
    - assets/icons/buy/home-maintenance-trades/
    - assets/icons/buy/outdoor-services/
    - assets/icons/buy/cleaning-household/
    - assets/icons/buy/moving-transport/
    - assets/icons/buy/childcare-caregiving/
    - assets/icons/buy/pet-services/
    - assets/icons/buy/education-tutoring/
    - assets/icons/buy/creative-media/
    - assets/icons/buy/fitness-health/
    - assets/icons/buy/professional-services/
    - assets/icons/buy/medical/
    - assets/icons/buy/repairs-technical/
    - assets/icons/buy/clothing/
    - assets/icons/buy/events/
    - assets/icons/buy/labour/
    - assets/icons/fintech_complete_icon_set/
    - assets/animations/
    - assets/botton_nav_bar_icons/
    - assets/video/

  # Plus Jakarta Sans is loaded via google_fonts package.
  # To bundle for offline use, download from Google Fonts and uncomment:
  # fonts:
  #   - family: Plus Jakarta Sans
  #     fonts:
  #       - asset: assets/fonts/PlusJakartaSans-Light.ttf
  #         weight: 300
  #       - asset: assets/fonts/PlusJakartaSans-Regular.ttf
  #       - asset: assets/fonts/PlusJakartaSans-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/PlusJakartaSans-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
  #         weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/iMaliCrown4.png"
  adaptive_icon_foreground: "assets/icons/iMaliCrown4.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_padding: 0
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

dependency_overrides:
  record_linux: ^1.3.0
