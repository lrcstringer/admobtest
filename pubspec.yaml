name: imalichat
description: "AdMob rewarded ad test"
publish_to: 'none'
version: 2.0.3+21

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^2.5.0

  # Firebase
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3

  # Security (SessionLockService chain)
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.1
  crypto: ^3.0.6
  device_info_plus: ^12.3.0

  # AdMob
  google_mobile_ads: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/iMaliCrown4.png"
  adaptive_icon_foreground: "assets/icons/iMaliCrown4.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_padding: 0
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
