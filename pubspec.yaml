name: imalichat
description: "iMaliChat - Earn rewards for your attention"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4

  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Navigation
  go_router: ^14.6.2

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  cloud_functions: ^5.1.6
  firebase_messaging: ^15.1.6
  firebase_analytics: ^11.3.6
  firebase_app_check: ^0.3.1+6

  # Local Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.1

  # Utilities
  dartz: ^0.10.1
  equatable: ^2.0.7
  intl: any
  uuid: ^4.5.1
  collection: ^1.18.0
  internet_connection_checker_plus: ^2.5.2
  shared_preferences: ^2.3.4
  firebase_storage: ^12.3.7

  # UI
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.2.0
  video_player: ^2.9.2

  # Forms & Validation
  reactive_forms: ^17.0.1

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Contacts
  flutter_contacts: ^1.1.9+2

  # Share
  share_plus: ^10.1.3
  url_launcher: ^6.3.1

  # Misc
  pin_code_fields: ^8.0.1
  flutter_animate: ^4.5.0
  confetti: ^0.7.0

  # Device Info (for fraud prevention)
  device_info_plus: ^10.1.2

  # HTTP client (for external API calls)
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2
  drift_dev: ^2.22.1

  # Testing
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  # Note: Uncomment assets and fonts when actual files are added
  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/animations/
  #   - assets/fonts/

  # fonts:
