# Reduced heap to leave room for native memory (R8/JIT compiler)
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC

android.useAndroidX=true

# Speed up builds
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# R8 full mode for better optimization (requires less memory than default)
android.enableR8.fullMode=true
