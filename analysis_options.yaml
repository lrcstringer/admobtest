include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Freezed v3.2.x generates mixins with abstract getters that the Dart 3.11+
    # analyzer flags on the non-abstract redirect class. This is a known
    # Freezed codegen issue — the concrete implementations exist in the
    # generated _$ClassName class. Safe to suppress until Freezed fixes this.
    non_abstract_class_inherits_abstract_member: ignore
